[project]
name = "gridgov"
version = "0.1.0"
description = "Grid Governor API"
authors = [{ name = "Jarrod Seccombe", email = "jarrod.seccombe@icloud.com" }]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "authlib>=1.7.2",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0",
    "structlog>=26.1.0",
    "typer>=0.27.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
gridgov = "gridgov.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyrefly]
project-includes = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "sqlacodegen>=4.0.4",
    "testcontainers[postgres]>=4.15.0",
]
