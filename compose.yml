services:
  alloy:
    command: run /etc/alloy/config.alloy --storage.path=/var/lib/alloy/data --server.http.listen-addr=0.0.0.0:12345
    depends_on:
      - lgtm
    image: grafana/alloy:v1.20.1
    ports:
      - '4318:4318'
      - '12345:12345'
    volumes:
      - ./deploy/alloy/local.alloy:/etc/alloy/config.alloy:ro

  lgtm:
    image: grafana/otel-lgtm:0.36.0
    ports:
      - '3001:3000'
