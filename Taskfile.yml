version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  dev:
    deps:
      - dev:api
      - dev:web

  dev:api:
    internal: true
    dir: api
    cmd: uv run uvicorn gridgov.main:app --reload --port 8000

  dev:web:
    internal: true
    dir: web
    cmd: pnpm dev

  migrate:
    dir: api
    cmd: uv run alembic upgrade head

  migrate:create:
    dir: api
    cmd: uv run alembic revision -m "{{.CLI_ARGS}}"

  gen:
    cmds:
      - task: gen:tables
      - task: gen:client

  gen:tables:
    internal: true
    dir: api
    dotenv:
      - .env
    vars:
      OUT: src/gridgov/db/tables.py
    cmds:
      - uv run sqlacodegen "$DATABASE_URL_SYNC" --generator tables --outfile {{.OUT}}
      - uv run ruff format {{.OUT}}
      - uv run ruff check --fix {{.OUT}}

  gen:client:
    internal: true
    dir: web
    cmd: pnpm gen

  test:
    cmds:
      - task: test:api
      - task: test:web

  test:api:
    internal: true
    dir: api
    cmd: uv run pytest || [ $? -eq 5 ]

  test:web:
    internal: true
    dir: web
    cmd: pnpm exec vitest run

  lint:
    cmds:
      - task: lint:api
      - task: lint:web

  lint:api:
    internal: true
    dir: api
    cmds:
      - uv run ruff check .
      - uv run pyrefly check

  lint:web:
    internal: true
    dir: web
    cmds:
      - pnpm lint
      - pnpm exec tsc -b
